description: >-
  Commercial pricing for the Memoir product (operated by Tachyon Labs, Inc.) as
  published at https://www.trymemoir.ai/pricing/ on 2026-08-13. Three tiers —
  Starter at $300/month, Scale at $1,500/month, and a custom-priced Enterprise
  tier. These are SEAT/PRODUCT plans for the Memoir SaaS application, not API
  plans: Memoir publishes no public API, no developer portal, and no API pricing
  of any kind. Every tier is purchased through a "Book a demo" / "Talk to us"
  Calendly conversation rather than self-serve checkout, so no online sign-up
  flow or published overage rate exists.
