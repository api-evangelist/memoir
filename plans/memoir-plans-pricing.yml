notes:
  - >-
    These are application/product plans, not API plans. Memoir publishes no
    developer program: api.trymemoir.ai answers every path with HTTP 401
    {"detail":"Not signed in"} and www.trymemoir.ai/developers, /docs and
    /llms.txt all return 404 (probed 2026-08-13).
  - >-
    No self-serve sign-up exists. Every tier, including Starter, routes to a
    "Book a demo" Calendly link; the site's only authenticated entry point is
    /login for existing customers.
  - >-
    No overage rates, usage metering, seat pricing, or annual-billing discount
    are published. Workspace counts on Scale are described qualitatively
    ("multiple") with no numeric cap, so limit is recorded as null rather than
    guessed.
