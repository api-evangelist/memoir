name: Memoir
description: >-
  Memoir, operated by Tachyon Labs, Inc., is an AI-powered marketing automation
  platform in Y Combinator's Spring 2026 (S26) batch. It connects to a company's
  development and product tools such as GitHub, Linear, and Slack and turns
  shipped product updates into multi-channel marketing content: social posts,
  blog posts, changelogs, demo videos, and customer updates generated in the
  company's brand voice. The product is organized around "Memory" (Atlas) for
  building context about a company and "Motion" (market-motion) for producing and
  distributing content as teams ship features. Memoir is a marketing SaaS product;
  as of this profile it exposes only a private authenticated backend
  (api.trymemoir.ai returns 401) and publishes no public developer API,
  documentation, or SDKs.
