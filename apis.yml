name: Memoir
description: >-
  Memoir, operated by Tachyon Labs, Inc., is an AI-powered marketing automation
  platform in Y Combinator's Spring 2026 batch, founded in 2026 by Maanav Agrawal
  and Jason Zhan. It connects to the systems where product work happens — GitHub,
  Linear and Slack on every plan, plus Jira, Notion, Google Docs, Drive and CRM on
  higher tiers — and turns shipped product updates into multi-channel marketing
  content: social posts, blog posts, changelogs, launch pages, ads, demo videos
  and customer updates generated in the company's brand voice and routed through
  human approval. The product is organized around "Memory" (Atlas) for building
  context about a company and "Motion" (market-motion) for producing and
  distributing content as teams ship features. Published customers include Datost,
  Smol Machines, TraceRoot and Zatanna. Pricing is published at three tiers —
  Starter $300/mo, Scale $1,500/mo and a custom Enterprise tier — all sold through
  a demo conversation rather than self-serve checkout. Memoir is a marketing SaaS
  product with no developer program: it exposes only a private session-
  authenticated backend (api.trymemoir.ai answers every path, including
  /.well-known/*, with HTTP 401 "Not signed in") and publishes no public API,
  developer portal, API reference, machine-readable specification, SDK, CLI or
  MCP server.
